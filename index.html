<!DOCTYPE html>
<html lang="zh-HANT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能魚缸 3D 監控</title>

  <!-- 1. 引入 3D 模型檢視器 -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <!-- 2. 引入 Firebase SDK (Compat 版本) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #eef2f5; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    }
    model-viewer { 
      width: 100%; 
      height: 100%; 
    }

    /* 3D 模型上面的 Hotspot 按鈕樣式 */
    .Hotspot {
      background: #007bff;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      transition: all 0.2s ease;
    }
    .Hotspot:active { 
      background: #0056b3; 
      transform: scale(0.95); 
    }

    /* 點擊按鈕後跳出的數據卡片 */
    .data-popup {
      display: none; /* 預設隱藏 */
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.9);
      color: white;
      padding: 16px 24px;
      border-radius: 14px;
      text-align: center;
      z-index: 100;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      min-width: 220px;
      backdrop-filter: blur(5px);
      cursor: pointer;
    }
    .popup-title { 
      font-size: 15px; 
      font-weight: bold; 
      color: #00e5ff; 
      margin-bottom: 8px; 
      border-bottom: 1px solid rgba(255,255,255,0.2); 
      padding-bottom: 6px; 
    }
    .popup-value { 
      font-size: 16px; 
      color: #ffffff; 
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- 3D 模型檢視器 -->
  <model-viewer 
    src="fishtank.glb" 
    alt="3D 魚缸模型" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1">

    <!-- 按鈕 1：對應你的 hotspot-4 座標 -->
    <button class="Hotspot" slot="hotspot-4" 
      data-position="-0.010191755613542935m 0.10093541499130976m 0.03105941947413131m" 
      data-normal="-0.004096846572960706m 0.9503509426195306m -0.3111531804599267m" 
      data-visibility-attribute="visible" 
      onclick="showData('bask_temp')">
      ☀️ 曬台溫度
    </button>

    <!-- 按鈕 2：對應你的 hotspot-5 座標 -->
    <button class="Hotspot" slot="hotspot-5" 
      data-position="0.032999235605824184m 0.11660087208074732m -0.032094734037154675m" 
      data-normal="0.0031711902879639786m -0.007693965257198799m -0.9999653726258618m" 
      data-visibility-attribute="visible" 
      onclick="showData('fan_humidity')">
      🌀 風扇 & 濕度
    </button>

    <!-- 按鈕 3：對應你的 hotspot-7 座標 -->
    <button class="Hotspot" slot="hotspot-7" 
      data-position="-0.01936004637642777m 0.007001865183448641m -0.02091115585370021m" 
      data-normal="-0.07950776142264725m 0.9946358544422366m -0.06616670561182332m" 
      data-visibility-attribute="visible" 
      onclick="showData('room_temp')">
      🌡️ 室溫
    </button>

  </model-viewer>

  <!-- 點擊 Hotspot 後跳出的數據視窗 (點一下視窗即可關閉) -->
  <div id="popup" class="data-popup" onclick="this.style.display='none'">
    <div id="popup-title" class="popup-title">數據讀取中</div>
    <div id="popup-content" class="popup-value">載入中...</div>
    <div style="font-size:11px; color:#aaa; margin-top:8px;">(按一下視窗關閉)</div>
  </div>

 <script>
    // 1. Firebase 連線設定
    const firebaseConfig = {
      apiKey: "AIzaSyBoZQ6UmtmXsDA2M187cvbmv_zQ3dlbiEw",
      authDomain: "esp-test-4384d.firebaseapp.com",
      databaseURL: "https://esp-test-4384d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "esp-test-4384d",
      storageBucket: "esp-test-4384d.firebasestorage.app",
      messagingSenderId: "759658685444",
      appId: "1:759658685444:web:890097fdfb06af62184151"
    };

    // 初始化 Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // 2. 將變數綁定在 window 上，確保點擊 Hotspot 時能全局存取
    window.aquariumData = null;
    window.currentDataType = '';

    // 3. 即時監聽 /aquarium 節點
    db.ref('/aquarium').on('value', (snapshot) => {
      window.aquariumData = snapshot.val();
      console.log("Firebase 數據已更新：", window.aquariumData);
      
      // 如果彈出視窗正在顯示，同步刷新數據
      const popup = document.getElementById('popup');
      if (popup && popup.style.display === 'block') {
        updatePopupUI();
      }
    });

    // 4. 點擊 Hotspot 按鈕時執行的函數
    window.showData = function(type) {
      window.currentDataType = type;
      document.getElementById('popup').style.display = 'block';
      updatePopupUI();
    };

    // 5. 渲染視窗文字內容
    function updatePopupUI() {
      const titleEl = document.getElementById('popup-title');
      const contentEl = document.getElementById('popup-content');
      const data = window.aquariumData;

      if (!data) {
        titleEl.innerText = '⚠️ 提示';
        contentEl.innerText = '正在等待 Firebase 數據...';
        return;
      }

      if (window.currentDataType === 'bask_temp') {
        titleEl.innerText = '☀️ 曬台溫度感應器';
        contentEl.innerHTML = `<span style="font-size:26px; color:#00e5ff; font-weight:bold;">${data.bask_temp ?? '--'}</span> °C`;
      } 
      else if (window.currentDataType === 'fan_humidity') {
        titleEl.innerText = '🌀 風扇與濕度狀態';
        contentEl.innerHTML = `
          環境濕度：<b style="color:#00e5ff">${data.humidity ?? '--'} %</b><br>
          風扇狀態：<b style="color:#00e5ff">${data.fan_status ?? '--'}</b>
        `;
      } 
      else if (window.currentDataType === 'room_temp') {
        titleEl.innerText = '🌡️ 房間溫度感應器';
        contentEl.innerHTML = `<span style="font-size:26px; color:#00e5ff; font-weight:bold;">${data.room_temp ?? '--'}</span> °C`;
      }
    }
  </script>

</body>
</html>
