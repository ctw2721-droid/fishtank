<!DOCTYPE html>
<html lang="zh-HANT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 模型測試</title>

  <!-- 引入 Google 官方 3D 檢視元件 -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%; 
      overflow: hidden; 
      background-color: #eef2f5; 
    }
    model-viewer {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <!-- 3D 展示區 -->
  <!-- 注意：src 裡面的檔名要跟你資料夾內的 3D 檔名完全一模一樣 -->
  <model-viewer 
    src="fishtank.glb" 
    alt="3D 模型" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1">
  </model-viewer>

</body>
</html>
